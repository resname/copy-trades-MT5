[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copy-trades-mt5-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pywin32>=306",
    "psutil>=5.9",
    "MetaTrader5>=5.0.45",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["manager/tests"]

[tool.setuptools.packages.find]
include = ["manager*"]
